# Local demonstration stack. Copy .env.example to .env to override ports/config.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-itms_bd}
      POSTGRES_USER: ${POSTGRES_USER:-itms_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itms123456}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    command: >-
      -c shared_buffers=256MB -c effective_cache_size=1GB -c work_mem=8MB
      -c maintenance_work_mem=64MB -c random_page_cost=1.1 -c max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "5"]
      interval: 5s
      timeout: 10s
      retries: 20

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-itms_bd}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-itms_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-itms123456}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:-ITMS-BD-DevSecret-Change-Me-At-Least-32-Bytes}
      ITMS_DEMO_ENABLED: ${ITMS_DEMO_ENABLED:-true}
      ITMS_DEMO_RESET_DEFAULT_USERS: ${ITMS_DEMO_RESET_DEFAULT_USERS:-false}
      ITMS_MIGRATE_LEGACY_PASSWORDS: ${ITMS_MIGRATE_LEGACY_PASSWORDS:-true}
      ITMS_TRAFFIC_SIMULATOR_ENABLED: ${ITMS_TRAFFIC_SIMULATOR_ENABLED:-true}
      ITMS_HTTP_THREADS: ${ITMS_HTTP_THREADS:-64}
      ITMS_MAX_IN_FLIGHT: ${ITMS_MAX_IN_FLIGHT:-24}
      ITMS_DB_POOL_SIZE: ${ITMS_DB_POOL_SIZE:-20}
      ITMS_KAFKA_PARTITIONS: ${ITMS_KAFKA_PARTITIONS:-1}
      ITMS_KAFKA_REPLICAS: ${ITMS_KAFKA_REPLICAS:-1}
      ITMS_KAFKA_CONCURRENCY: ${ITMS_KAFKA_CONCURRENCY:-1}
      ITMS_CORS_ALLOWED_ORIGINS: ${ITMS_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      TZ: Asia/Shanghai
      JAVA_OPTS: -Xms256m -Xmx768m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      start_period: 45s
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres_data:
  redis_data:
